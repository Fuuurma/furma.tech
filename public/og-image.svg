<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d0d0d"/>
  
  {/* Background Pattern */}
  <g opacity="0.1">
    <circle cx="1100" cy="100" r="300" fill="url(#paint0_radial)"/>
    <circle cx="100" cy="530" r="200" fill="url(#paint1_radial)"/>
  </g>

  {/* Logo Mark */}
  <rect x="100" y="100" width="80" height="80" rx="16" fill="white"/>
  <text x="140" y="155" font-family="serif" font-size="48" font-weight="bold" fill="#0d0d0d" text-anchor="middle">F</text>

  {/* Brand Name */}
  <text x="200" y="150" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" letter-spacing="0.05em">FURMA.TECH</text>

  {/* Headline */}
  <text x="100" y="320" font-family="serif" font-size="84" font-weight="bold" fill="white">
    Build software
  </text>
  <text x="100" y="410" font-family="serif" font-size="84" font-weight="bold" fill="url(#paint2_linear)" font-style="italic">
    that works.
  </text>

  {/* Description */}
  <text x="100" y="500" font-family="sans-serif" font-size="24" fill="#808080">
    Digital Venture Studio &amp; Sovereign AI Ecosystem
  </text>

  {/* Badges */}
  <rect x="100" y="540" width="140" height="32" rx="16" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.2"/>
  <text x="170" y="561" font-family="monospace" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">BOOTSTRAPPED</text>

  <rect x="260" y="540" width="100" height="32" rx="16" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.2"/>
  <text x="310" y="561" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">EU BASED</text>

  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1100 100) rotate(90) scale(300)">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paint1_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 530) rotate(90) scale(200)">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paint2_linear" x1="100" y1="350" x2="500" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>
