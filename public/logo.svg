<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist F Logo for Furma.tech -->
  <!-- Clean, geometric design -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Main F shape - constructed from geometric elements -->
  <rect x="60" y="50" width="20" height="100" fill="black" rx="2"/>
  <rect x="80" y="50" width="60" height="20" fill="black" rx="2"/>
  <rect x="80" y="90" width="40" height="20" fill="black" rx="2"/>
  
  <!-- Subtle dot accent -->
  <circle cx="140" cy="140" r="8" fill="black"/>
</svg>
