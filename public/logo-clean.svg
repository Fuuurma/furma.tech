<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Furma.tech Logo - Minimalist Black & White -->
  <!-- Clean geometric F mark -->
  <rect width="400" height="400" fill="white"/>
  
  <!-- Vertical stem of F -->
  <rect x="140" y="100" width="28" height="200" fill="black" rx="3"/>
  
  <!-- Top horizontal bar -->
  <rect x="168" y="100" width="100" height="28" fill="black" rx="3"/>
  
  <!-- Middle horizontal bar (shorter) -->
  <rect x="168" y="170" width="70" height="28" fill="black" rx="3"/>
  
  <!-- Optional: Small dot accent for tech feel -->
  <circle cx="280" cy="280" r="12" fill="black"/>
</svg>
